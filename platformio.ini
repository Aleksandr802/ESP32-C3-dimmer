; One firmware, one build per location. Pick the location in VS Code's
; PlatformIO toolbar (env), or on the command line:
;   pio run -e esp-32u -t upload          bathroom (ESP32 dev board, 22 LEDs)
;   pio run -e kitchen_light -t upload    kitchen (ESP32-C3 SuperMini, 52 LEDs, hand sensor)
; Each setting is explained at the top of src/main.cpp.

[platformio]
; The Upload button builds this one. For the bathroom choose env:esp-32u in
; the PlatformIO toolbar, or run: pio run -e esp-32u -t upload
default_envs = kitchen_light

[env]
platform = espressif32
framework = arduino
lib_deps =
	makuna/NeoPixelBus@^2.8.3
	esphome/ESPAsyncWebServer-esphome@^3.3.0
monitor_speed = 115200

; Bathroom: unchanged behaviour (light on at boot, instant on/off, no sensor).
[env:esp-32u]
board = esp32dev
upload_speed = 921600
build_flags =
	'-DLOCATION_TITLE="Living Room Light"'
	'-DAP_SSID="BathLight"'
	'-DAP_PASSWORD_DEFAULT="LightCtrl987"'
	-DLED_PIN=12
	-DNUM_LEDS=22
	-DFADE_MS=0
	-DDISABLE_BROWNOUT=1

; Kitchen: ESP32-C3 SuperMini, 52 x WS2812B, push button.
; Wiring: README.md, "Kitchen light". Button between GPIO3 and GND, no resistors.
[env:kitchen_light]
board = esp32-c3-devkitm-1
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	'-DLOCATION_TITLE="Kitchen Light"'
	'-DAP_SSID="KitchenLight"'
	-DKITCHEN_SECRETS=1
	-DLED_PIN=4
	-DNUM_LEDS=52
	-DFADE_MS=600
	-DSENSOR_PIN=3
	-DSENSOR_ACTIVE_HIGH=0
	-DSENSOR_PULL=1
	-DSENSOR_LATCHING=0
	-DSENSOR_LOCKOUT_MS=300
